<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400">
  <defs>
    <style>
      .agent-box { fill: #e1f5ff; stroke: #01579b; stroke-width: 2; }
      .approval-box { fill: #ffe0b2; stroke: #e65100; stroke-width: 2; }
      .execution-box { fill: #fff9c4; stroke: #f57f17; stroke-width: 2; }
      .decision-box { fill: #f3e5f5; stroke: #4a148c; stroke-width: 2; }
      .start-end { fill: #c8e6c9; stroke: #1b5e20; stroke-width: 2; rx: 20; }
      .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-size: 16px; font-weight: bold; }
      .small-text { font-size: 12px; }
      .arrow { fill: none; stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .success-arrow { stroke: #2e7d32; }
      .error-arrow { stroke: #c62828; }
      .label-text { font-size: 11px; fill: #555; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="text title">Agentic Data Assistant - LangGraph Workflow</text>

  <!-- Start -->
  <rect x="520" y="60" width="160" height="50" class="start-end"/>
  <text x="600" y="90" class="text">User Request</text>

  <!-- Orchestrator Agent -->
  <rect x="480" y="140" width="240" height="80" class="agent-box"/>
  <text x="600" y="165" class="text title">Orchestrator Agent</text>
  <text x="600" y="185" class="text small-text">Analyzes request</text>
  <text x="600" y="205" class="text small-text">Creates step-by-step plan</text>

  <!-- Await Initial Approval -->
  <polygon points="600,250 720,295 600,340 480,295" class="approval-box"/>
  <text x="600" y="290" class="text">Await Initial</text>
  <text x="600" y="305" class="text">Approval</text>

  <!-- Generator Agent -->
  <rect x="480" y="370" width="240" height="80" class="agent-box"/>
  <text x="600" y="395" class="text title">Generator Agent</text>
  <text x="600" y="415" class="text small-text">Generates SQL/Python code</text>
  <text x="600" y="435" class="text small-text">for each step</text>

  <!-- Await Code Approval -->
  <polygon points="600,480 720,525 600,570 480,525" class="approval-box"/>
  <text x="600" y="520" class="text">Await Code</text>
  <text x="600" y="535" class="text">Approval</text>

  <!-- Step Type Router -->
  <polygon points="600,610 720,655 600,700 480,655" class="decision-box"/>
  <text x="600" y="650" class="text">Check Step</text>
  <text x="600" y="665" class="text">Type</text>

  <!-- Executor Agent -->
  <rect x="200" y="740" width="240" height="80" class="execution-box"/>
  <text x="320" y="765" class="text title">Executor Agent</text>
  <text x="320" y="785" class="text small-text">Runs BigQuery queries</text>
  <text x="320" y="805" class="text small-text">GCS read/write operations</text>

  <!-- Analyzer Agent -->
  <rect x="760" y="740" width="240" height="80" class="execution-box"/>
  <text x="880" y="765" class="text title">Analyzer Agent</text>
  <text x="880" y="785" class="text small-text">Analyzes execution results</text>
  <text x="880" y="805" class="text small-text">Generates insights</text>

  <!-- Execution Success Check -->
  <polygon points="320,860 440,905 320,950 200,905" class="decision-box"/>
  <text x="320" y="900" class="text">Execution</text>
  <text x="320" y="915" class="text">Success?</text>

  <!-- Error Refiner Agent -->
  <rect x="40" y="990" width="240" height="80" class="agent-box"/>
  <text x="160" y="1015" class="text title">Error Refiner Agent</text>
  <text x="160" y="1035" class="text small-text">Analyzes failure reason</text>
  <text x="160" y="1055" class="text small-text">Suggests fixes</text>

  <!-- More Steps Check -->
  <polygon points="600,1000 720,1045 600,1090 480,1045" class="decision-box"/>
  <text x="600" y="1040" class="text">More</text>
  <text x="600" y="1055" class="text">Steps?</text>

  <!-- Await Proceed -->
  <polygon points="880,1130 1000,1175 880,1220 760,1175" class="approval-box"/>
  <text x="880" y="1170" class="text">Await Human</text>
  <text x="880" y="1185" class="text">Proceed</text>

  <!-- End -->
  <rect x="520" y="1320" width="160" height="50" class="start-end"/>
  <text x="600" y="1350" class="text">End</text>

  <!-- Arrows -->
  <!-- Start to Orchestrator -->
  <path d="M 600,110 L 600,140" class="arrow"/>

  <!-- Orchestrator to Initial Approval -->
  <path d="M 600,220 L 600,250" class="arrow"/>

  <!-- Initial Approval to Generator (APPROVED) -->
  <path d="M 600,340 L 600,370" class="arrow success-arrow"/>
  <text x="620" y="360" class="label-text">APPROVED</text>

  <!-- Initial Approval back to Orchestrator (RECREATE) -->
  <path d="M 480,295 L 400,295 L 400,180 L 480,180" class="arrow"/>
  <text x="370" y="240" class="label-text">RECREATE</text>

  <!-- Initial Approval to End (REJECT) -->
  <path d="M 720,295 L 900,295 L 900,1345 L 680,1345" class="arrow error-arrow"/>
  <text x="920" y="290" class="label-text">REJECT</text>

  <!-- Generator to Code Approval -->
  <path d="M 600,450 L 600,480" class="arrow"/>

  <!-- Code Approval to Step Type -->
  <path d="M 600,570 L 600,610" class="arrow success-arrow"/>
  <text x="620" y="595" class="label-text">APPROVED</text>

  <!-- Code Approval to Generator (REFINE) -->
  <path d="M 480,525 L 420,525 L 420,410 L 480,410" class="arrow"/>
  <text x="390" y="470" class="label-text">REFINE</text>

  <!-- Code Approval to Orchestrator (RECREATE) -->
  <path d="M 720,525 L 1020,525 L 1020,180 L 720,180" class="arrow"/>
  <text x="1040" y="350" class="label-text">RECREATE</text>

  <!-- Step Type to Executor -->
  <path d="M 540,670 L 380,720" class="arrow"/>
  <text x="450" y="690" class="label-text">EXECUTE</text>

  <!-- Step Type to Analyzer -->
  <path d="M 660,670 L 820,720" class="arrow"/>
  <text x="750" y="690" class="label-text">ANALYZE</text>

  <!-- Step Type to Await Proceed -->
  <path d="M 720,655 L 880,1130" class="arrow"/>
  <text x="820" y="890" class="label-text">AWAIT_PROCEED</text>

  <!-- Executor to Success Check -->
  <path d="M 320,820 L 320,860" class="arrow"/>

  <!-- Success Check to Error Refiner (FAILED) -->
  <path d="M 260,925 L 200,990" class="arrow error-arrow"/>
  <text x="220" y="960" class="label-text">FAILED</text>

  <!-- Error Refiner back to Code Approval -->
  <path d="M 160,990 L 160,525 L 480,525" class="arrow"/>

  <!-- Success Check to More Steps (SUCCESS) -->
  <path d="M 380,925 L 480,1045" class="arrow success-arrow"/>
  <text x="450" y="990" class="label-text">SUCCESS</text>

  <!-- Analyzer to More Steps -->
  <path d="M 820,820 L 680,1000" class="arrow"/>

  <!-- More Steps back to Step Type (YES) -->
  <path d="M 600,1000 L 600,700" class="arrow"/>
  <text x="615" y="850" class="label-text">YES</text>

  <!-- More Steps to End (NO) -->
  <path d="M 600,1090 L 600,1320" class="arrow"/>
  <text x="615" y="1205" class="label-text">NO</text>

  <!-- Await Proceed to More Steps (PROCEED) -->
  <path d="M 820,1200 L 680,1090" class="arrow success-arrow"/>
  <text x="740" y="1150" class="label-text">PROCEED</text>

  <!-- Await Proceed to End (REJECT) -->
  <path d="M 880,1220 L 880,1345 L 680,1345" class="arrow error-arrow"/>
  <text x="900" y="1280" class="label-text">REJECT</text>

  <!-- Legend -->
  <g transform="translate(50, 1250)">
    <text x="0" y="0" class="text title">Legend:</text>
    <rect x="0" y="10" width="100" height="30" class="agent-box"/>
    <text x="110" y="30" class="text" text-anchor="start">LLM Agent</text>
    
    <rect x="250" y="10" width="100" height="30" class="approval-box"/>
    <text x="360" y="30" class="text" text-anchor="start">Human Approval</text>
    
    <rect x="500" y="10" width="100" height="30" class="execution-box"/>
    <text x="610" y="30" class="text" text-anchor="start">Execution</text>
    
    <polygon points="750,10 850,25 750,40 650,25" class="decision-box"/>
    <text x="860" y="30" class="text" text-anchor="start">Decision Point</text>
  </g>

  <!-- Infrastructure Note -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" class="small-text" font-weight="bold">Infrastructure:</text>
    <text x="0" y="15" class="small-text">• Flask API on Cloud Run</text>
    <text x="0" y="30" class="small-text">• Vertex AI (Gemini 2.5 Flash)</text>
    <text x="0" y="45" class="small-text">• Pub/Sub for approvals</text>
    <text x="0" y="60" class="small-text">• BigQuery + GCS for data</text>
  </g>
</svg>
